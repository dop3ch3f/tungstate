name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs a system webview to build against. Only Linux ships it as
      # separate packages; macOS and Windows have theirs already.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tungstate-gui/ui/package-lock.json

      # generate_context! embeds the built frontend at compile time, so the
      # Rust build cannot start until these files exist.
      - name: Build the interface
        working-directory: crates/tungstate-gui/ui
        run: |
          npm ci
          npm run build

      # Components come from rust-toolchain.toml, so none are listed here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --locked fails the build on a stale lockfile instead of silently
      # resolving new dependency versions nobody reviewed.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # FTP needs a server, so this is Linux only and behind a feature flag.
  # Everything the engine does without rename is covered by a fake backend in
  # the main job, on all three platforms; this proves the protocol adapter
  # against a real vsftpd.
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not a service container: FTP passive mode needs the server to hand out
      # an address the client can actually reach, and a published port range
      # is the simplest way to get that right.
      - name: Start an FTP server
        run: |
          docker run -d --name tungstate-ftp \
            -p 2121:21 -p 30000-30039:30000-30039 \
            -e USERS="tungstate|s3cret|/ftp/tungstate|10000" \
            -e ADDRESS=127.0.0.1 -e MIN_PORT=30000 -e MAX_PORT=30039 \
            delfer/alpine-ftp-server
          # The image creates the account before the directory, so make it.
          for _ in $(seq 1 30); do
            docker exec tungstate-ftp sh -c \
              'mkdir -p /ftp/tungstate && chown tungstate:tungstate /ftp/tungstate' && break
            sleep 1
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No frontend build: this job never compiles the Tauri crate.
      - run: cargo test --locked -p tungstate-cli --features ftp-integration --test ftp
        env:
          TUNGSTATE_FTP_HOST: 127.0.0.1
          TUNGSTATE_FTP_PORT: "2121"
          TUNGSTATE_FTP_USER: tungstate
          TUNGSTATE_FTP_PASSWORD: s3cret
          TUNGSTATE_FTP_ROOT: /ftp/tungstate

      - name: FTP server log
        if: always()
        run: docker logs tungstate-ftp
