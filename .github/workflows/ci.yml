name: CI

on:
  push:
    # Slice branches too. A slice is only finished when it is green on all
    # three platforms, and waiting for a pull request to find that out means
    # finding out late. `fix-**` is here because slice 4g shipped on one and so
    # never got a run at all: nothing matched the branch and there was no pull
    # request to fall back on.
    branches: [main, "slice-**", "fix-**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs a system webview to build against. Only Linux ships it as
      # separate packages; macOS and Windows have theirs already.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tungstate-gui/ui/package-lock.json

      # generate_context! embeds the built frontend at compile time, so the
      # Rust build cannot start until these files exist.
      - name: Build the interface
        working-directory: crates/tungstate-gui/ui
        run: |
          npm ci
          npm run build

      # Components come from rust-toolchain.toml, so none are listed here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --locked fails the build on a stale lockfile instead of silently
      # resolving new dependency versions nobody reviewed.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # FTP needs a server, so this is Linux only and behind a feature flag.
  # Everything the engine does without rename is covered by a fake backend in
  # the main job, on all three platforms; this proves the protocol adapter
  # against a real vsftpd.
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image logs `adduser: /ftp/tungstate: No such file or directory`: it
      # creates the account before the home, so the account exists pointing at
      # a directory that does not. A bind mount makes the directory exist
      # before the container does, which is earlier than any repair step can
      # run — so there is no repair step here any more.
      #
      # Owned by 10000 because that is the uid the USERS spec pins below, and a
      # bind mount passes uids straight through without translating them.
      - name: Give the account a home before the server starts
        run: |
          mkdir -p "${{ runner.temp }}/ftp-home"
          sudo chown 10000:10000 "${{ runner.temp }}/ftp-home"

      # Not a service container: FTP passive mode needs the server to hand out
      # an address the client can actually reach, and a published port range
      # is the simplest way to get that right.
      - name: Start an FTP server
        run: |
          docker run -d --name tungstate-ftp \
            -p 2121:21 -p 30000-30039:30000-30039 \
            -v "${{ runner.temp }}/ftp-home:/ftp/tungstate" \
            -e USERS="tungstate|s3cret|/ftp/tungstate|10000" \
            -e ADDRESS=127.0.0.1 -e MIN_PORT=30000 -e MAX_PORT=30039 \
            delfer/alpine-ftp-server

          # Ready has to mean usable, not merely authenticated. A login can
          # succeed in the window before the root is listable, and that window
          # was the flake: this job went green, red, green, red across four
          # branches with no code change to explain it.
          #
          # So the poll does what the suite's very first call does — log in and
          # LIST the root over a passive data connection. That also proves the
          # published port range works, which a login alone never touches.
          python3 - <<'PY'
          import ftplib, sys, time
          last = None
          for _ in range(60):
              try:
                  ftp = ftplib.FTP()
                  ftp.connect("127.0.0.1", 2121, timeout=3)
                  ftp.login("tungstate", "s3cret")
                  # LIST rather than NLST: some servers answer NLST on an empty
                  # directory with 550, and empty is exactly what this is.
                  ftp.retrlines("LIST", lambda _line: None)
                  ftp.quit()
                  print("ftp server is ready")
                  sys.exit(0)
              except Exception as error:
                  last = error
                  time.sleep(1)
          print(f"ftp server never came up: {last}", file=sys.stderr)
          sys.exit(1)
          PY

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No frontend build: this job never compiles the Tauri crate.
      - run: cargo test --locked -p tungstate-cli --features ftp-integration --test ftp
        env:
          TUNGSTATE_FTP_HOST: 127.0.0.1
          TUNGSTATE_FTP_PORT: "2121"
          TUNGSTATE_FTP_USER: tungstate
          TUNGSTATE_FTP_PASSWORD: s3cret
          TUNGSTATE_FTP_ROOT: /ftp/tungstate

      - name: FTP server log
        if: always()
        run: docker logs tungstate-ftp
