name: CI

on:
  push:
    # Slice branches too. A slice is only finished when it is green on all
    # three platforms, and waiting for a pull request to find that out means
    # finding out late. `fix-**` is here because slice 4g shipped on one and so
    # never got a run at all: nothing matched the branch and there was no pull
    # request to fall back on.
    branches: [main, "slice-**", "fix-**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs a system webview to build against. Only Linux ships it as
      # separate packages; macOS and Windows have theirs already.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tungstate-gui/ui/package-lock.json

      # generate_context! embeds the built frontend at compile time, so the
      # Rust build cannot start until these files exist.
      - name: Build the interface
        working-directory: crates/tungstate-gui/ui
        run: |
          npm ci
          npm run build
          npm test

      # Components come from rust-toolchain.toml, so none are listed here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --locked fails the build on a stale lockfile instead of silently
      # resolving new dependency versions nobody reviewed.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # FTP needs a server, so this is Linux only and behind a feature flag.
  # Everything the engine does without rename is covered by a fake backend in
  # the main job, on all three platforms; this proves the protocol adapter
  # against a real vsftpd.
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image logs `adduser: /ftp/tungstate: No such file or directory`: it
      # creates the account before the home, so the account exists pointing at
      # a directory that does not. A bind mount makes the directory exist
      # before the container does, which is earlier than any repair step can
      # run — so there is no repair step here any more.
      #
      # Owned by 10000 because that is the uid the USERS spec pins below, and a
      # bind mount passes uids straight through without translating them.
      - name: Give the account a home before the server starts
        run: |
          mkdir -p "${{ runner.temp }}/ftp-home"
          sudo chown 10000:10000 "${{ runner.temp }}/ftp-home"

      # Not a service container: FTP passive mode needs the server to hand out
      # an address the client can actually reach, and a published port range
      # is the simplest way to get that right.
      - name: Start an FTP server
        run: |
          docker run -d --name tungstate-ftp \
            -p 2121:21 -p 30000-30039:30000-30039 \
            -v "${{ runner.temp }}/ftp-home:/ftp/tungstate" \
            -e USERS="tungstate|s3cret|/ftp/tungstate|10000" \
            -e ADDRESS=127.0.0.1 -e MIN_PORT=30000 -e MAX_PORT=30039 \
            delfer/alpine-ftp-server

          # Ready has to mean usable, not merely authenticated. A login can
          # succeed in the window before the root is listable, and that window
          # was the flake: this job went green, red, green, red across four
          # branches with no code change to explain it.
          #
          # So the poll does what the suite's very first call does — log in and
          # LIST the root over a passive data connection. That also proves the
          # published port range works, which a login alone never touches.
          python3 - <<'PY'
          import ftplib, sys, time
          last = None
          for _ in range(60):
              try:
                  ftp = ftplib.FTP()
                  ftp.connect("127.0.0.1", 2121, timeout=3)
                  ftp.login("tungstate", "s3cret")
                  # LIST rather than NLST: some servers answer NLST on an empty
                  # directory with 550, and empty is exactly what this is.
                  ftp.retrlines("LIST", lambda _line: None)
                  ftp.quit()
                  print("ftp server is ready")
                  sys.exit(0)
              except Exception as error:
                  last = error
                  time.sleep(1)
          print(f"ftp server never came up: {last}", file=sys.stderr)
          sys.exit(1)
          PY

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No frontend build: this job never compiles the Tauri crate.
      - run: cargo test --locked -p tungstate-cli --features ftp-integration --test ftp
        env:
          TUNGSTATE_FTP_HOST: 127.0.0.1
          TUNGSTATE_FTP_PORT: "2121"
          TUNGSTATE_FTP_USER: tungstate
          TUNGSTATE_FTP_PASSWORD: s3cret
          TUNGSTATE_FTP_ROOT: /ftp/tungstate

      - name: FTP server log
        if: always()
        run: docker logs tungstate-ftp

  # S3 needs a service too. SeaweedFS speaks the same API as AWS, B2 and R2,
  # checks signatures, and has no rename, so this is the engine's no-rename
  # path over a second protocol. (MinIO's images are no longer public.)
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start an S3 service
        run: |
          cat > "${{ runner.temp }}/s3.json" <<'JSON'
          {"identities":[{"name":"tungstate","credentials":[{"accessKey":"tungstate","secretKey":"s3cret-s3cret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name tungstate-s3 -p 9000:8333 \
            -v "${{ runner.temp }}/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -s3.config=/etc/s3.json -dir=/data

          # Ready means the bucket exists and the S3 port answers. Creating the
          # bucket fails once it exists, so its answer is not a gate: when it
          # was, a bucket made while the S3 port was still starting failed
          # every later round and the check could never pass. Each check's
          # answer is kept, so a service that never comes up says why. The
          # image is pinned by digest so a new release cannot change this.
          for _ in $(seq 1 180); do
            made=$(docker exec tungstate-s3 sh -c "echo 's3.bucket.create -name tungstate' | weed shell" 2>&1) || true
            listed=$(docker exec tungstate-s3 sh -c "echo 's3.bucket.list' | weed shell" 2>&1) \
              && echo "$listed" | grep -q tungstate \
              && answered=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ 2>&1) \
              && { echo "s3 service is ready (http $answered)"; exit 0; }
            sleep 1
          done
          echo "s3 service never came up" >&2
          echo "bucket.create said: $made" >&2
          echo "bucket.list said: $listed" >&2
          echo "curl said: $answered" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked -p tungstate-cli --features s3-integration --test s3
        env:
          TUNGSTATE_S3_ENDPOINT: http://127.0.0.1:9000
          TUNGSTATE_S3_BUCKET: tungstate
          TUNGSTATE_S3_KEY: tungstate
          TUNGSTATE_S3_SECRET: s3cret-s3cret

      - name: S3 service log
        if: always()
        run: docker logs tungstate-s3

  # WebDAV against rclone's server: uploads are our own streamed PUT and the
  # rest is OpenDAL, so this proves the two agree on where a file lives.
  webdav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start a WebDAV server
        run: |
          docker run -d --name tungstate-webdav -p 8088:8080 \
            rclone/rclone@sha256:3103526c506266a9ecdf064efe99bf3677d92ef6407af124d8c56b4f49cbaa51 \
            serve webdav /data --addr :8080 --user tungstate --pass s3cret
          for _ in $(seq 1 60); do
            answered=$(curl -s -o /dev/null -w '%{http_code}' -u tungstate:s3cret \
              -X PROPFIND -H 'Depth: 0' http://127.0.0.1:8088/ 2>&1) || true
            [ "$answered" = "207" ] && { echo "webdav server is ready"; exit 0; }
            sleep 1
          done
          echo "webdav server never came up; last answer: $answered" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked -p tungstate-cli --features webdav-integration --test webdav
        env:
          TUNGSTATE_WEBDAV_ENDPOINT: http://127.0.0.1:8088
          TUNGSTATE_WEBDAV_USER: tungstate
          TUNGSTATE_WEBDAV_PASSWORD: s3cret

      - name: WebDAV server log
        if: always()
        run: docker logs tungstate-webdav

  # SMB reached directly, with nothing mounted, against Samba: the backend's
  # own suite and the drain and a sync through the binary.
  smb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start an SMB server
        run: |
          docker run -d --name tungstate-samba -p 445:445 \
            -e NETBIOS_DISABLE=1 -e AVAHI_DISABLE=1 -e WSDD2_DISABLE=1 \
            -e ACCOUNT_tungstate=s3cret -e UID_tungstate=1000 \
            -e 'SAMBA_VOLUME_CONFIG_media=[media]; path=/shares/media; valid users = tungstate; guest ok = no; read only = no' \
            ghcr.io/servercontainers/samba:smbd-only-latest

          # Ready means the share's folder exists, belongs to the account, and
          # the server is taking connections on 445.
          for _ in $(seq 1 60); do
            if docker exec tungstate-samba sh -c 'mkdir -p /shares/media && chown 1000 /shares/media' 2>/dev/null \
              && bash -c 'echo > /dev/tcp/127.0.0.1/445' 2>/dev/null; then
              echo "smb server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "smb server never came up" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked -p tungstate-backend-smb --features samba-integration
        env:
          TUNGSTATE_SMB_HOST: 127.0.0.1
          TUNGSTATE_SMB_PORT: "445"
          TUNGSTATE_SMB_USER: tungstate
          TUNGSTATE_SMB_PASSWORD: s3cret
          TUNGSTATE_SMB_SHARE: media
      - run: cargo test --locked -p tungstate-cli --features smb-integration --test smb
        env:
          TUNGSTATE_SMB_HOST: 127.0.0.1
          TUNGSTATE_SMB_PORT: "445"
          TUNGSTATE_SMB_USER: tungstate
          TUNGSTATE_SMB_PASSWORD: s3cret
          TUNGSTATE_SMB_SHARE: media

      - name: SMB server log
        if: always()
        run: docker logs tungstate-samba
