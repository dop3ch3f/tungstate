name: Release

# Tags only. A release is a deliberate act, and anything else would publish
# artefacts nobody decided to publish.
on:
  push:
    tags: ["v*"]
  # So the pipeline can be proved before a real tag exists. Builds everything
  # and uploads nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The command line tool, as a plain archive. No installer, no signing, no
  # webview: on a NAS or over SSH this is the only half that makes sense.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the CLI package, so this never needs a webview or a frontend
      # build. `--locked` for the same reason CI uses it.
      - name: Build
        run: cargo build --release --locked -p tungstate-cli --target ${{ matrix.target }}

      # A checksum beside every artefact. Downloading an unsigned binary is
      # already an act of trust; not being able to check it arrived intact
      # would be worse.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          name="tungstate-${version}-${{ matrix.label }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/tungstate
          [ -f "$bin" ] || bin="$bin.exe"
          cp "$bin" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The desktop app. Separate because it needs a frontend build, a system
  # webview on Linux, and produces installers rather than a binary.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            args: ""
            label: windows-x86_64
          - os: ubuntu-22.04
            args: ""
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/tungstate-gui/ui/package-lock.json
      - run: npm ci
        working-directory: crates/tungstate-gui/ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}

      # Unsigned, deliberately. There is no Apple Developer certificate and no
      # Windows code-signing certificate, so macOS will show a Gatekeeper
      # warning and Windows a SmartScreen one. The release notes say so and
      # tell people how to get past it. Adding signing later is secrets plus a
      # few lines here, not a rewrite.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/tungstate-gui
          args: ${{ matrix.args }}
          # Upload is handled by the publish job, so every artefact in a
          # release is described by one set of notes.
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/*/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish:
    needs: [cli, desktop]
    # Only a tag becomes a release. A manual run proves the build and stops.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # Anything with a hyphen in the version is a prerelease, so
          # v0.1.0-alpha.1 never shows up as "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: .github/RELEASE_NOTES_HEADER.md
          fail_on_unmatched_files: true
