[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dop3ch3f/tungstate"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
# bundled compiles SQLite from source: no system library, identical on all three platforms
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
blake3 = "1.8"
trash = "5.2"
# Only the services this slice registers. `fs` is how the adapter is exercised
# on all three platforms with no server; FTP arrives in 4c as one more flag.
opendal = { version = "0.59", default-features = false, features = ["executors-tokio", "services-fs", "services-memory"] }
# The adapter owns one runtime purely to drive OpenDAL's async API. Nothing
# else in the workspace is async; see DESIGN.md §7.
tokio = { version = "1", features = ["rt-multi-thread"] }
keyring = "4.2"
rpassword = "7.5"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
insta = "1.48"
proptest = "1.11"
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
