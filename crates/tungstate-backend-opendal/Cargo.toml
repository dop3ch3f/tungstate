[package]
name = "tungstate-backend-opendal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["ftp", "s3", "smb", "webdav", "sftp"]
# FTP is on by default because a release binary has to be able to reach a NAS.
# It stays a feature so a smaller build is possible, and so `SchemeNotCompiled`
# means something rather than being a placeholder. S3 is the same bargain.
ftp = ["opendal/services-ftp"]
# SMB is not an OpenDAL service; it has a crate of its own, and this factory
# is still the one place that turns a connection into a backend.
smb = ["dep:tungstate-backend-smb"]
# SFTP is hand-rolled on russh too (DESIGN.md §6), in a crate of its own.
sftp = ["dep:tungstate-backend-sftp"]
s3 = ["opendal/services-s3", "https"]
# WebDAV uploads are our own streamed `PUT` (see `dav`), hence `reqwest/stream`.
webdav = ["opendal/services-webdav", "https", "reqwest/stream"]
# The HTTPS client S3 and WebDAV share, rustls on `ring`. Not a choice of its
# own: the services above turn it on.
https = ["dep:opendal-http-transport-reqwest", "dep:reqwest", "dep:rustls"]

[dependencies]
tungstate-backend = { path = "../tungstate-backend" }
tungstate-backend-smb = { path = "../tungstate-backend-smb", optional = true }
tungstate-backend-sftp = { path = "../tungstate-backend-sftp", optional = true }
tungstate-journal = { path = "../tungstate-journal" }
tungstate-secret = { path = "../tungstate-secret" }
opendal = { workspace = true }
# `BufferStream` is a `futures_core::Stream`, and pulling one item needs the
# extension trait. One RETR per file instead of one per megabyte.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { workspace = true }
# S3 speaks HTTPS through rustls, with `ring` doing the cryptography: already
# in the build through Tauri, where rustls's own default would add a C library
# every release runner has to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
opendal-http-transport-reqwest = { version = "0.59", default-features = false, features = ["rustls-no-provider"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
