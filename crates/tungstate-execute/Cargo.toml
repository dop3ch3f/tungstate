[package]
name = "tungstate-execute"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Carrying out a plan, and taking one back. Its own crate rather than part of
# tungstate-transfer: that crate is about links -- two backends, a verify
# level, a resume, a conflict policy per link -- and this is one folder, one
# backend, and a plan somebody already approved. They share a discipline and
# almost no code.
[dependencies]
blake3 = { workspace = true }
trash = { workspace = true }
tungstate-core = { path = "../tungstate-core" }
tungstate-backend = { path = "../tungstate-backend" }
tungstate-journal = { path = "../tungstate-journal" }
tungstate-likeness = { path = "../tungstate-likeness" }
# The width a transfer settles on, and its back-off when refused, reused so
# reading for duplicates asks a NAS for no more than a copy would.
tungstate-transfer = { path = "../tungstate-transfer" }
thiserror = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tungstate-attrs = { path = "../tungstate-attrs" }
# Drawing a picture to look at, in the only place that needs one.
image = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
