[package]
name = "tungstate-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tungstate-backend = { path = "../tungstate-backend" }
tungstate-journal = { path = "../tungstate-journal" }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Phones have no trash to send an original to; there, a trash request is refused.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
trash = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The same suite, run a second time with the destination reached through
# OpenDAL's `fs` service. That is the whole point of slice 4b's seam.
tungstate-backend-opendal = { path = "../tungstate-backend-opendal" }
tungstate-secret = { path = "../tungstate-secret" }

[lints]
workspace = true
