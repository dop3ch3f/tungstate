[package]
name = "tungstate-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tungstate-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tungstate-backend = { path = "../tungstate-backend" }
tungstate-backend-opendal = { path = "../tungstate-backend-opendal" }
tungstate-secret = { path = "../tungstate-secret" }
tungstate-journal = { path = "../tungstate-journal" }
tungstate-transfer = { path = "../tungstate-transfer" }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# A real directory for the browse tests, so a connection is walked rather than
# mocked. Nothing here touches the real journal or the real keychain.
tempfile = { workspace = true }

[lints]
workspace = true
