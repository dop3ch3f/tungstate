[package]
name = "tungstate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tungstate"
path = "src/main.rs"

[features]
# Opt-in: these tests need a real FTP server on the other end, so CI runs them
# on Linux only. Everything the engine does without rename is covered by a fake
# backend in tungstate-transfer, on all three platforms.
ftp-integration = []
# The same bargain for S3: CI runs these on Linux against SeaweedFS.
s3-integration = []
# And for SMB, against Samba.
smb-integration = []

[dependencies]
tungstate-api = { path = "../tungstate-api" }
tungstate-backend = { path = "../tungstate-backend" }
tungstate-backend-opendal = { path = "../tungstate-backend-opendal" }
tungstate-secret = { path = "../tungstate-secret" }
tungstate-journal = { path = "../tungstate-journal" }
tungstate-transfer = { path = "../tungstate-transfer" }
tungstate-core = { path = "../tungstate-core" }
tungstate-attrs = { path = "../tungstate-attrs" }
tungstate-execute = { path = "../tungstate-execute" }
tungstate-watch = { path = "../tungstate-watch" }
tungstate-sync = { path = "../tungstate-sync" }
clap = { workspace = true }
jiff = { workspace = true }
# The one place in the workspace that draws a policy span. Libraries carry
# spans as data; only the edge knows how to render them (DESIGN.md §7).
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Never a flag value: a password given as an argument lands in shell history
# and in `ps` output for every other user on the machine.
rpassword = { workspace = true }

[dev-dependencies]
# The SMB suite's second, independent client: the backend itself, signed in
# separately from the binary under test.
tungstate-backend-smb = { path = "../tungstate-backend-smb" }
# The S3 suite's second, independent client. Already in the build through
# tungstate-backend-opendal, so this costs no new compilation.
opendal = { workspace = true, features = ["services-s3"] }
opendal-http-transport-reqwest = { version = "0.59", default-features = false }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true }
# Drawing a picture for the near-duplicate test, so no binary is checked in.
image = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
